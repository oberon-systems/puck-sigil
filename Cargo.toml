[package]
name = "puck-sigil"
version = "0.1.0"
edition = "2024"
authors = ["zombig <me@zombig.name>"]
description = "A simple git version tagger"
license = "MIT"
repository = "https://github.com/username/puck-sigil"
readme = "README.md"
keywords = ["version", "config", "git"]
categories = ["command-line-utilities", "development-tools"]

include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "src/**/*",
]

[[bin]]
name = "psigil"
path = "src/main.rs"

[dependencies]
log = "0.4.28"
toml = "0.9.7"
env_logger = "0.11.8"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"

[dev-dependencies]
serial_test = "3.2.0"
tempfile = "3.23.0"
